[project]
name = "hindsight"
version = "0.2.0a0"
description = "Hindsight：可追溯的对话知识检索与受控记忆系统（只读 MCP · 评测门 · 并发基准 · 容器复现）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1",
    "pydantic>=2.7",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_brain"]

[project.scripts]
brain = "personal_brain.cli:main"
personal-brain-mcp = "personal_brain.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
