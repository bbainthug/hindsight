# Personal Brain 配置示例（§16：示例不含真实账号、密钥、聊天路径或正文）
# 复制为 config/config.yaml 并改为本机私有数据根目录下的实际路径。
# 私有数据根目录不应位于 Git、默认云同步或 Agent 工作目录中。

database_path: /path/to/private-data-root/db/brain.sqlite
archive_dir: /path/to/private-data-root/raw
backup_dir: /path/to/private-data-root/backups

# 自然日期解析所用时区（§4.4：CLI 接收自然日期时按配置时区转为明确边界）
timezone: UTC

search:
  default_limit: 10
  max_limit: 50
  snippet_chars: 400
  max_text_chars: 8000
  max_scan: 50000

# D-2 事实层提炼（可选）：OpenAI 兼容接口。
# 密钥只从环境变量读取（api_key_env 指定变量名），不写入任何文件；
# 未设置环境变量时 brain facts extract 报错，其余功能不受影响。
facts:
  base_url: https://api.deepseek.com
  model: deepseek-flash        # DeepSeek 2026-09 起的模型名（以官网为准）
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.2
  timeout_seconds: 120
  max_segment_chars: 6000      # 分段字符目标；单条超长消息仍可能越限
  max_output_tokens: 2000
  budget_tokens: 500000        # 单次提炼预算；估算超出即拒绝执行
  dedup_threshold: 0.9         # 相近度 ≥ 此值合并为同一主张的新证据
  conflict_threshold: 0.45     # 相近度 ≥ 此值送 LLM 做关系建议（仅建议）
  max_gap_seconds: 3600        # 分段时间间隔阈值
  context_messages: 4          # 切分时携带的有限上下文条数
  # max_owner_chars: 500       # 跳过超过该长度的 owner 发言（超长粘贴文本，预算收窄用）
  # include_assistant_context: false  # 分段不携带 assistant 消息（预算收窄用，默认 true）
  # extra_body:                  # 合并进请求体的附加字段；DeepSeek 默认开思考模式，会吃掉 max_tokens
  #   thinking: {type: disabled}
